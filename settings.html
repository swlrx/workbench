<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网址管理</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #202020; --panel: #202020; --row-border: #333; --row-default: #243447;
    --fg: #e8e8e8; --fg-dim: #999; --input-bg: #171717; --input-border: #555;
    --btn-bg: #3a3a3a; --btn-hover: #505050; --accent: #3578b9; --danger: #7a3434; --error: #ff8c8c;
  }
  body.light {
    --bg: #f5f5f5; --panel: #f5f5f5; --row-border: #ddd; --row-default: #d7e6f7;
    --fg: #262626; --fg-dim: #666; --input-bg: #ffffff; --input-border: #bbb;
    --btn-bg: #e4e4e4; --btn-hover: #d5d5d5; --accent: #3578b9; --danger: #b95c5c; --error: #c33;
  }
  body { margin: 0; padding: 22px; background: var(--bg); color: var(--fg); font: 14px "Microsoft YaHei", sans-serif; }
  h2 { margin: 0 0 8px; font-size: 20px; }
  .hint { color: var(--fg-dim); margin-bottom: 18px; }
  #list { border: 1px solid var(--row-border); border-radius: 8px; overflow: hidden; min-height: 260px; }
  .row { display: grid; grid-template-columns: 36px minmax(220px, 1fr) minmax(120px, .55fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--row-border); }
  .row:last-child { border-bottom: none; }
  .row.default { background: var(--row-default); }
  .index { color: var(--fg-dim); text-align: center; }
  input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); color: var(--fg); outline: none; }
  input[type=text]:focus { border-color: #4a90d9; }
  button { border: 0; border-radius: 6px; padding: 8px 11px; background: var(--btn-bg); color: var(--fg); cursor: pointer; }
  button:hover { background: var(--btn-hover); }
  button.primary { background: var(--accent); color: #fff; }
  button.danger { background: var(--danger); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .actions { display: flex; gap: 6px; }
  .footer { display: flex; justify-content: space-between; margin-top: 16px; }
  .footer-right { display: flex; gap: 8px; }
  #error { color: var(--error); min-height: 22px; margin-top: 10px; }
</style>
</head>
<body>
<h2>网址管理</h2>
<div class="hint">可设置网址和标签别名。别名留空时，标签页仍显示网页默认标题。可删除全部网址，删除后下次启动为空白状态。</div>
<div id="list"></div>
<div id="error"></div>
<div class="footer">
  <button id="add">添加网址</button>
  <div class="footer-right">
    <button id="cancel">取消</button>
    <button class="primary" id="save">保存</button>
  </div>
</div>
<script>
const { ipcRenderer } = require('electron');
const list = document.getElementById('list');
const errorEl = document.getElementById('error');
let state = { urls: [], defaultUrl: '', aliases: {} };

// 主题跟随主进程
ipcRenderer.on('theme:update', (_e, theme) => {
  document.body.classList.toggle('light', theme === 'light');
});
ipcRenderer.invoke('theme:get').then(t => {
  document.body.classList.toggle('light', t === 'light');
}).catch(() => {});

function localPathToFileUrl(value) {
  const text = String(value || '').trim();
  if (/^file:\/\//i.test(text)) {
    try {
      const u = new URL(text);
      if (/^[a-zA-Z]$/.test(u.host)) return `file:///${u.host}:${u.pathname}`;
      return u.href;
    } catch { return null; }
  }
  const p = text.replace(/\\/g, '/');
  let m = p.match(/^([a-zA-Z]):\/(.*)$/);
  if (m) return `file:///${m[1]}:/${m[2].split('/').map(s => s ? encodeURIComponent(s) : '').join('/')}`;
  m = p.match(/^\/\/([^/]+)\/(.*)$/);
  if (m) return `file://${m[1]}/${m[2].split('/').map(s => s ? encodeURIComponent(s) : '').join('/')}`;
  if (p.startsWith('/')) return `file:///${p.slice(1).split('/').map(s => s ? encodeURIComponent(s) : '').join('/')}`;
  return null;
}

function normalize(value) {
  let text = String(value || '').trim();
  const fileUrl = localPathToFileUrl(text);
  if (fileUrl) return fileUrl;
  if (text && !/^https?:\/\//i.test(text)) text = 'https://' + text;
  try {
    const url = new URL(text);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
  } catch { return ''; }
}

function render() {
  list.innerHTML = '';
  state.urls.forEach((url, index) => {
    const row = document.createElement('div');
    row.className = 'row' + (url === state.defaultUrl ? ' default' : '');
    row.innerHTML = `
      <div class="index">${index + 1}</div>
      <input class="url" type="text" title="网址" value="${url.replaceAll('&', '&amp;').replaceAll('"', '&quot;')}" />
      <input class="alias" type="text" maxlength="100" title="标签别名" placeholder="别名（可选）" value="${String(state.aliases[url] || '').replaceAll('&', '&amp;').replaceAll('"', '&quot;')}" />
      <div class="actions">
        <button data-action="default" ${url === state.defaultUrl ? 'disabled' : ''}>设为默认</button>
        <button data-action="up" ${index === 0 ? 'disabled' : ''}>上移</button>
        <button data-action="down" ${index === state.urls.length - 1 ? 'disabled' : ''}>下移</button>
        <button class="danger" data-action="delete">删除</button>
      </div>`;
    const input = row.querySelector('.url');
    input.addEventListener('change', () => {
      const updated = normalize(input.value);
      if (!updated) { errorEl.textContent = '网址格式不正确'; return; }
      const old = state.urls[index];
      state.urls[index] = updated;
      if (state.defaultUrl === old) state.defaultUrl = updated;
      if (state.aliases[old]) {
        state.aliases[updated] = state.aliases[old];
        delete state.aliases[old];
      }
      errorEl.textContent = '';
      render();
    });
    row.querySelector('.alias').addEventListener('input', event => {
      const alias = event.target.value.trim();
      if (alias) state.aliases[state.urls[index]] = alias;
      else delete state.aliases[state.urls[index]];
    });
    row.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
      const action = button.dataset.action;
      if (action === 'default') state.defaultUrl = state.urls[index];
      if (action === 'up' && index > 0) [state.urls[index - 1], state.urls[index]] = [state.urls[index], state.urls[index - 1]];
      if (action === 'down' && index < state.urls.length - 1) [state.urls[index + 1], state.urls[index]] = [state.urls[index], state.urls[index + 1]];
      if (action === 'delete') {
        const removed = state.urls.splice(index, 1)[0];
        delete state.aliases[removed];
        if (state.defaultUrl === removed) state.defaultUrl = state.urls[0] || '';
      }
      render();
    }));
    list.appendChild(row);
  });
}

document.getElementById('add').addEventListener('click', () => {
  state.urls.push('https://');
  render();
  const inputs = list.querySelectorAll('.url');
  inputs[inputs.length - 1].focus();
  inputs[inputs.length - 1].select();
});
document.getElementById('cancel').addEventListener('click', () => window.close());
document.getElementById('save').addEventListener('click', async () => {
  const inputs = [...list.querySelectorAll('.url')];
  const urls = inputs.map(input => normalize(input.value));
  if (urls.some(url => !url)) { errorEl.textContent = '请检查网址格式'; return; }
  if (new Set(urls).size !== urls.length) { errorEl.textContent = '网址不能重复'; return; }
  state.urls = urls;
  if (!state.urls.includes(state.defaultUrl)) state.defaultUrl = state.urls[0] || '';
  try {
    await ipcRenderer.invoke('settings:save', state);
    window.close();
  } catch (error) {
    errorEl.textContent = error.message;
  }
});

ipcRenderer.invoke('settings:get').then(settings => {
  state = { ...settings, urls: [...settings.urls], aliases: { ...(settings.aliases || {}) } };
  render();
}).catch(error => { errorEl.textContent = error.message; });
</script>
</body>
</html>
