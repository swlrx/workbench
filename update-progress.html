<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在下载更新</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { margin: 0; padding: 26px 30px; font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #202020; color: #eee; }
  h1 { margin: 0 0 10px; font-size: 18px; font-weight: 600; }
  #version { color: #aaa; font-size: 13px; margin-bottom: 18px; }
  .track { width: 100%; height: 16px; overflow: hidden; border-radius: 8px; background: #3a3a3a; }
  #bar { width: 0; height: 100%; background: #4a90d9; transition: width .15s linear; }
  .details { display: flex; justify-content: space-between; margin-top: 10px; color: #bbb; font-size: 13px; }
  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  button { min-width: 90px; padding: 7px 18px; border: 0; border-radius: 5px; background: #444; color: #fff; cursor: pointer; }
  button:hover { background: #555; }
</style>
</head>
<body>
  <h1>正在下载工作台更新</h1>
  <div id="version">正在准备下载…</div>
  <div class="track"><div id="bar"></div></div>
  <div class="details"><span id="percent">0%</span><span id="size">0 B / 0 B</span><span id="speed">0 B/s</span></div>
  <div class="actions"><button id="hide">隐藏</button></div>
<script>
const { ipcRenderer } = require('electron');
const versionEl = document.getElementById('version');
const barEl = document.getElementById('bar');
const percentEl = document.getElementById('percent');
const sizeEl = document.getElementById('size');
const speedEl = document.getElementById('speed');

function formatBytes(value) {
  const bytes = Math.max(0, Number(value) || 0);
  if (bytes < 1024) return `${Math.round(bytes)} B`;
  const units = ['KB', 'MB', 'GB'];
  let size = bytes;
  let unit = 'B';
  for (const next of units) {
    size /= 1024;
    unit = next;
    if (size < 1024) break;
  }
  return `${size.toFixed(size >= 100 ? 0 : size >= 10 ? 1 : 2)} ${unit}`;
}

ipcRenderer.on('update:progress', (_event, data = {}) => {
  const percent = Math.max(0, Math.min(100, Number(data.percent) || 0));
  versionEl.textContent = data.version ? `版本 ${data.version}` : '正在准备下载…';
  barEl.style.width = `${percent}%`;
  percentEl.textContent = `${percent.toFixed(1)}%`;
  sizeEl.textContent = `${formatBytes(data.transferred)} / ${formatBytes(data.total)}`;
  speedEl.textContent = `${formatBytes(data.bytesPerSecond)}/s`;
});

document.getElementById('hide').addEventListener('click', () => ipcRenderer.send('update:hide-progress'));
</script>
</body>
</html>
