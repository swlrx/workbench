<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 38px; min-height: 38px; max-height: 38px; overflow: hidden; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    padding: 0 6px;
    -webkit-app-region: drag;
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    border-bottom: 1px solid var(--border);
    color: var(--fg);
  }
  #tabs { display: flex; align-items: center; gap: 2px; flex: 1 1 auto; min-width: 0; overflow: hidden; -webkit-app-region: no-drag; }
  .tab {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; height: 30px;
    background: transparent; color: var(--fg-dim);
    border-radius: 6px 6px 0 0; cursor: pointer; font-size: 13px;
    flex: 1 1 160px; max-width: 200px; min-width: 0;
    transition: background .12s, color .12s;
    white-space: nowrap;
  }
  .tab:hover { background: var(--hover); color: var(--fg); }
  .tab.active { background: var(--active-bg); color: var(--fg); }
  .tab.dragging { opacity: .35; }
  .tab.drop-before { box-shadow: inset 3px 0 0 var(--fg); }
  .tab.drop-after { box-shadow: inset -3px 0 0 var(--fg); }
  .tab .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; pointer-events: none; }
  .tab .close { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 3px; font-size: 15px; opacity: .5; flex-shrink: 0; line-height: 1; }
  .tab .close:hover { opacity: 1; background: var(--hover-strong); }
  .newtab {
    width: 28px; height: 28px; border: none; background: transparent;
    color: var(--fg-dim); border-radius: 6px; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; -webkit-app-region: no-drag; line-height: 1;
  }
  .newtab:hover { background: var(--hover); color: var(--fg); }

  #urlModal {
    position: fixed; top: 3px; right: 40px;
    background: var(--modal-bg); padding: 2px; height: 32px; border-radius: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6); z-index: 9999;
    display: none; align-items: center; border: 1px solid var(--border);
    -webkit-app-region: no-drag;
  }
  #urlModal input { width: min(380px, calc(100vw - 150px)); height: 26px; padding: 3px 9px; background: var(--input-bg); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; font-size: 13px; outline: none; }
  #urlModal input:focus { border-color: #4a90d9; }
  #urlModal button { height: 26px; padding: 3px 14px; background: #4a90d9; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-left: 4px; font-size: 13px; }
  #urlModal button:hover { opacity: .85; }
</style>
</head>
<body>
  <div id="tabs"></div>
  <button class="newtab" id="newTabBtn" title="新建标签页">+</button>

  <div id="urlModal">
    <input type="text" id="urlInput" placeholder="输入网址，如 https://example.com" />
    <button id="urlOk">打开</button>
  </div>
<script>
const { ipcRenderer } = require('electron');
const tabsEl = document.getElementById('tabs');
const newTabBtn = document.getElementById('newTabBtn');
const urlModal = document.getElementById('urlModal');
const urlInput = document.getElementById('urlInput');
const urlOk = document.getElementById('urlOk');

// 主题变量（深色/浅色）
const THEMES = {
  dark: {
    '--bg': '#202020', '--border': '#3a3a3a', '--fg': '#e0e0e0', '--fg-dim': '#888',
    '--hover': '#333', '--hover-strong': 'rgba(255,255,255,.12)', '--active-bg': '#2a2a2a',
    '--modal-bg': '#2a2a2a', '--input-bg': '#1a1a1a'
  },
  light: {
    '--bg': '#f5f5f5', '--border': '#d4d4d4', '--fg': '#262626', '--fg-dim': '#777',
    '--hover': '#e2e2e2', '--hover-strong': 'rgba(0,0,0,.10)', '--active-bg': '#ffffff',
    '--modal-bg': '#ffffff', '--input-bg': '#ffffff'
  }
};

function applyThemeVars(theme) {
  const vars = THEMES[theme] || THEMES.dark;
  for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(k, v);
}

applyThemeVars('dark'); // 初始深色；主进程加载后立即发送真实主题
ipcRenderer.on('theme:update', (_e, theme) => applyThemeVars(theme));
ipcRenderer.invoke('theme:get').then(t => applyThemeVars(t)).catch(() => {});


function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function renderTabs(tabs, activeId) {
  tabsEl.innerHTML = '';
  for (const tab of tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (tab.id === activeId ? ' active' : '');
    el.innerHTML = '<span class="title">' + esc(tab.title) + '</span><span class="close" data-id="' + tab.id + '">\u00d7</span>';
    el.addEventListener('click', function(e) {
      if (!e.target.classList.contains('close')) ipcRenderer.send('tab:switch', tab.id);
    });
    el.querySelector('.close').addEventListener('click', function(e) {
      e.stopPropagation();
      ipcRenderer.send('tab:close', tab.id);
    });
    el.setAttribute('draggable', 'true');
    el.addEventListener('dragstart', function(e) {
      dragId = tab.id;
      el.classList.add('dragging');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', String(tab.id)); } catch (err) {}
      }
    });
    el.addEventListener('dragend', function() {
      dragId = null;
      clearDropMarks();
    });
    el.addEventListener('dragover', function(e) {
      if (dragId === null || dragId === tab.id) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      const rect = el.getBoundingClientRect();
      const after = (e.clientX - rect.left) > rect.width / 2;
      clearDropMarks();
      el.classList.add(after ? 'drop-after' : 'drop-before');
    });
    el.addEventListener('dragleave', function() { el.classList.remove('drop-before', 'drop-after'); });
    el.addEventListener('drop', function(e) {
      if (dragId === null || dragId === tab.id) return;
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const after = (e.clientX - rect.left) > rect.width / 2;
      ipcRenderer.send('tab:move', dragId, tab.id, after);
      dragId = null;
      clearDropMarks();
    });
    tabsEl.appendChild(el);
  }
}

let dragId = null;
function clearDropMarks() {
  tabsEl.querySelectorAll('.drop-before, .drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));
}

newTabBtn.addEventListener('click', function() {
  urlModal.style.display = 'flex';
  urlInput.value = '';
  urlInput.focus();
});

function localPathToFileUrl(value) {
  const text = String(value || '').trim();
  if (/^file:\/\//i.test(text)) {
    try {
      const u = new URL(text);
      if (/^[a-zA-Z]$/.test(u.host)) return `file:///${u.host}:${u.pathname}`;
      return u.href;
    } catch { return null; }
  }
  const p = text.replace(/\\/g, '/');
  let m = p.match(/^([a-zA-Z]):\/(.*)$/);
  if (m) return `file:///${m[1]}:/${m[2].split('/').map(s => s ? encodeURIComponent(s) : '').join('/')}`;
  m = p.match(/^\/\/([^/]+)\/(.*)$/);
  if (m) return `file://${m[1]}/${m[2].split('/').map(s => s ? encodeURIComponent(s) : '').join('/')}`;
  if (p.startsWith('/')) return `file:///${p.slice(1).split('/').map(s => s ? encodeURIComponent(s) : '').join('/')}`;
  return null;
}

function submitUrl() {
  let url = urlInput.value.trim();
  if (!url) { urlModal.style.display = 'none'; return; }
  const fileUrl = localPathToFileUrl(url);
  if (fileUrl) url = fileUrl;
  else if (!/^https?:\/\//.test(url)) url = 'https://' + url;
  ipcRenderer.send('tab:new', url);
  urlModal.style.display = 'none';
}

urlOk.addEventListener('click', submitUrl);
urlInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitUrl();
  if (e.key === 'Escape') urlModal.style.display = 'none';
});



document.addEventListener('click', function(e) {
  if (e.target !== urlModal && !urlModal.contains(e.target) && e.target !== newTabBtn) {
    urlModal.style.display = 'none';
  }
});

ipcRenderer.on('tab:update', function(_e, data) {
  renderTabs(data.tabs, data.activeId);
});

// 主进程请求弹出新建标签输入框（首次启动无网址 / 关闭最后一个标签页时）
ipcRenderer.on('tab:prompt-new', function() {
  urlModal.style.display = 'flex';
  urlInput.value = '';
  urlInput.focus();
});


</script>
</body>
</html>
